# Build Face Fusion Studio (Windows x64 portable zip), test the PACKAGED exe on windows-latest, publish a GitHub Release.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create / update the GitHub Release with the zip"
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"
  GLOG_minloglevel: "2"
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-win.txt

      - name: Runner info
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, AdapterRAM | Format-List
          [System.Environment]::OSVersion.VersionString

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install -U pip wheel
          pip install -r requirements-win.txt
          python -c "import onnxruntime, cv2, PySide6, numpy; print(onnxruntime.__version__, onnxruntime.get_available_providers(), cv2.__version__, PySide6.__version__)"

      - name: Download LGPL FFmpeg (BtbN win64 lgpl-shared)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/download_ffmpeg.ps1
          Get-ChildItem ffmpeg | Format-Table Name, Length

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: .models-cache
          key: models-ffs-v1-${{ hashFiles('ffs/models.py') }}

      - name: Prefetch models (FaceFusion assets, SHA-256)
        shell: pwsh
        run: |
          $env:FFS_MODELS = "$PWD\.models-cache"
          python scripts/prefetch_models.py light

      - name: Fetch test clips (Mixkit, private people, SHA-checked)
        shell: pwsh
        run: python scripts/fetch_test_clips.py clips

      - name: PyInstaller (onedir, GUI exe + console exe)
        shell: pwsh
        run: |
          pyinstaller FaceFusionStudio.spec --noconfirm
          New-Item -ItemType Directory -Force -Path dist/FaceFusionStudio/ffmpeg | Out-Null
          Copy-Item ffmpeg/* dist/FaceFusionStudio/ffmpeg/ -Force
          "{0:N1} MB" -f ((Get-ChildItem dist/FaceFusionStudio -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Selftest - packaged FaceFusionStudio_cli.exe (photo + video through Final/mux, CPU, DirectML smoke)
        shell: pwsh
        run: |
          $out = "$PWD\selftest-out\cli"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & dist\FaceFusionStudio\FaceFusionStudio_cli.exe --selftest `
            --video clips\mixkit_48205.mp4 --photo testdata\faces_e5.jpg `
            --models "$PWD\.models-cache" --device cpu --enhance gpen256 `
            --start 1 --length 4 --fps 15 --max-short 720 --out $out --dml-smoke `
            --min-confidence 0.45 --same-gender --color-match --temporal-smooth 0.18
          $code = $LASTEXITCODE
          Get-Content "$out\selftest_report.json"
          if ($code -ne 0) { throw "selftest failed: $code" }

      - name: Selftest - packaged windowed FaceFusionStudio.exe (sample with audio)
        shell: pwsh
        run: |
          $out = "$PWD\selftest-out\gui_exe"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $p = Start-Process -FilePath dist\FaceFusionStudio\FaceFusionStudio.exe -PassThru -Wait -ArgumentList @(
            "--selftest", "--video", "`"$PWD\testdata\sample_2s.mp4`"", "--photo", "`"$PWD\testdata\faces_e5.jpg`"",
            "--models", "`"$PWD\.models-cache`"", "--device", "cpu", "--enhance", "off",
            "--start", "0", "--length", "2", "--fps", "15", "--max-short", "720", "--out", "`"$out`"")
          Write-Host "exit code $($p.ExitCode)"
          Get-Content "$out\selftest_report.json"
          if ($p.ExitCode -ne 0) { throw "windowed selftest failed" }

      - name: GUI launch smoke (real window on the runner desktop)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path screens-ci | Out-Null
          $env:FFS_MODELS = "$PWD\.models-cache"
          $p = Start-Process -FilePath dist\FaceFusionStudio\FaceFusionStudio.exe -PassThru -ArgumentList @(
            "--models", "`"$PWD\.models-cache`"", "--video", "`"$PWD\clips\mixkit_48205.mp4`"", "--photo", "`"$PWD\testdata\faces_e5.jpg`"")
          Start-Sleep -Seconds 45
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\screens-ci\desktop_gui_launch.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $alive = -not $p.HasExited
          Write-Host "GUI process alive after 45 s: $alive  screen $($b.Width)x$($b.Height)"
          "alive=$alive screen=$($b.Width)x$($b.Height)" | Out-File selftest-out\gui_launch.txt
          if ($alive) { Stop-Process -Id $p.Id -Force } else { throw "GUI exited early: $($p.ExitCode)" }

      - name: UI screenshots with the packaged exe (offscreen Qt, 150 %)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist\FaceFusionStudio\FaceFusionStudio_cli.exe -PassThru -Wait -NoNewWindow -ArgumentList @(
            "--screenshots", "`"$PWD\screens-ci`"", "--video", "`"$PWD\clips\mixkit_48205.mp4`"", "--photo", "`"$PWD\testdata\faces_e5.jpg`"",
            "--models", "`"$PWD\.models-cache`"", "--device", "cpu", "--length", "2")
          Get-ChildItem screens-ci | Format-Table Name, Length
          if ($p.ExitCode -ne 0) { Write-Host "screenshots exit $($p.ExitCode) (non-fatal)" }

      - name: Make portable zip
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/make_zip.ps1
          Get-ChildItem dist\*.zip | Format-Table Name, Length
          Get-Content dist\SHA256SUMS

      - name: Anonymous zip verify (extract + SHA)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\FaceFusionStudio-*-win64.zip | Select-Object -First 1
          $tmp = Join-Path $env:TEMP "ffs-anon-verify"
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          Expand-Archive $zip.FullName -DestinationPath $tmp
          $exe = Get-ChildItem $tmp -Recurse -Filter FaceFusionStudio_cli.exe | Select-Object -First 1
          if (-not $exe) { throw "cli exe missing from zip" }
          $sha = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          $expected = (Get-Content dist\SHA256SUMS | Select-Object -First 1).Split()[0].ToLower()
          if ($sha -ne $expected) { throw "SHA mismatch $sha vs $expected" }
          Write-Host "anonymous zip OK: $($zip.Name) sha=$sha exe=$($exe.FullName)"

      - name: Upload build + test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FaceFusionStudio-win64-tests
          path: |
            selftest-out/**
            screens-ci/**
            dist/SHA256SUMS

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceFusionStudio-win64-zip
          path: dist/FaceFusionStudio-*-win64.zip
          compression-level: 0

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem dist\FaceFusionStudio-*-win64.zip | Select-Object -First 1
          $ver = $zip.Name -replace '^FaceFusionStudio-(.+)-win64\.zip$', '$1'
          $tag = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { "v$ver" }
          $sha = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          $r = Get-Content selftest-out\cli\selftest_report.json -Raw | ConvertFrom-Json
          $dml = if ($r.directml) { ($r.directml | ConvertTo-Json -Compress -Depth 6) } else { "n/a" }
          $lines = @(
            "Face Fusion Studio **$ver** — portable Windows 10/11 x64 for the ASUS ROG Ally X (Radeon 780M, DirectML). Powered by FaceFusion-compatible ONNX models (YOLO Face + ArcFace + inswapper_128 fp16 + GPEN).",
            "",
            "| Asset | Size | SHA-256 |",
            "|---|---|---|",
            "| $($zip.Name) | $($zip.Length) bytes | ``$sha`` |",
            "",
            "### First run",
            "1. Unzip, open the FaceFusionStudio folder, run **FaceFusionStudio.exe**.",
            "2. **SmartScreen** (unsigned): click **More info** then **Run anyway**.",
            "3. Download AI models when asked (~465 MB required). InsightFace models are personal / non-commercial only.",
            "",
            "### Fixes in this release",
            "- Finding faces no longer closes the app (DirectML/ONNX now runs on one dedicated MTA thread).",
            "- Final / Finalize (encode + audio) always completes or times out with a clear error; progress updates; Cancel works.",
            "- Crash log: `%LOCALAPPDATA%\\FaceFusionStudio\\crash.log`",
            "",
            "### Modes",
            "- Photo swap → Pictures\\FaceFusion",
            "- Video swap → Videos\\FaceFusion",
            "",
            "### CI (windows-latest, packaged exe)",
            "- Selftest photo+video (CPU, Mixkit 4 s, Light enhancer): ok=$($r.ok)",
            "- Checks: $(($r.checks | ConvertTo-Json -Compress))",
            "- DirectML smoke: $dml",
            "",
            "Details: https://github.com/${{ github.repository }}#readme",
            "",
            "**Not** the full FaceFusion GPL desktop — custom UI + redistributable FaceFusion-class models.",
            "",
            "Does **not** touch face-swap-video-windows releases."
          )
          $lines -join "`n" | Out-File -Encoding utf8 notes.md
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $zip.FullName dist\SHA256SUMS --title "Face Fusion Studio for Windows $tag" --notes-file notes.md
          } else {
            gh release upload $tag $zip.FullName dist\SHA256SUMS --clobber
            gh release edit $tag --notes-file notes.md
          }
